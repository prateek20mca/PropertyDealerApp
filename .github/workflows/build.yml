          package com.propertydealer.app.ui.property
          import android.content.Intent
          import android.os.Bundle
          import android.text.Editable
          import android.text.TextWatcher
          import android.view.Menu
          import android.view.MenuItem
          import android.view.View
          import androidx.activity.viewModels
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.recyclerview.widget.LinearLayoutManager
          import com.propertydealer.app.R
          import com.propertydealer.app.databinding.ActivityMainBinding
          import com.propertydealer.app.firebase.UserSession
          import com.propertydealer.app.ui.adapters.PropertyAdapter
          import com.propertydealer.app.ui.auth.LoginActivity
          class MainActivity : AppCompatActivity() {
              private lateinit var binding: ActivityMainBinding
              private val viewModel: PropertyViewModel by viewModels { PropertyViewModelFactory(application) }
              private lateinit var adapter: PropertyAdapter
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  binding = ActivityMainBinding.inflate(layoutInflater)
                  setContentView(binding.root)
                  setSupportActionBar(binding.toolbar)
                  supportActionBar?.title = "My Properties"
                  setupAdapter()
                  observeData()
                  binding.fabAddProperty.setOnClickListener { startActivity(Intent(this, AddEditPropertyActivity::class.java)) }
                  binding.editTextSearch.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                      override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {}
                      override fun afterTextChanged(s: Editable?) {
                          val q = s.toString().trim()
                          if (q.length >= 2) {
                              viewModel.searchProperties(q).observe(this@MainActivity) { adapter.submitList(it) }
                          } else {
                              viewModel.allProperties.observe(this@MainActivity) { adapter.submitList(it) }
                          }
                      }
                  })
              }
              private fun setupAdapter() {
                  adapter = PropertyAdapter(
                      onItemClick = { property ->
                          startActivity(Intent(this, PropertyDetailActivity::class.java).apply { putExtra(PropertyDetailActivity.EXTRA_PROPERTY_ID, property.id) })
                      },
                      onEditClick = { property ->
                          startActivity(Intent(this, AddEditPropertyActivity::class.java).apply { putExtra(AddEditPropertyActivity.EXTRA_PROPERTY_ID, property.id) })
                      },
                      onDeleteClick = { property ->
                          AlertDialog.Builder(this).setTitle("Delete '${property.name}'?").setMessage("This cannot be undone.")
                              .setPositiveButton("Delete") { _, _ -> viewModel.deleteProperty(property) }
                              .setNegativeButton("Cancel", null).show()
                      }
                  )
                  binding.recyclerProperties.apply { layoutManager = LinearLayoutManager(this@MainActivity); adapter = this@MainActivity.adapter }
              }
              private fun observeData() {
                  viewModel.allProperties.observe(this) { properties ->
                      adapter.submitList(properties)
                      binding.textEmpty.visibility = if (properties.isEmpty()) View.VISIBLE else View.GONE
                  }
                  viewModel.totalCount.observe(this) { binding.textTotalCount.text = it.toString() }
                  viewModel.availableCount.observe(this) { binding.textAvailableCount.text = it.toString() }
                  viewModel.soldCount.observe(this) { binding.textSoldCount.text = it.toString() }
                  viewModel.upcomingCount.observe(this) { binding.textUpcomingCount.text = it.toString() }
              }
              override fun onCreateOptionsMenu(menu: Menu): Boolean { menuInflater.inflate(R.menu.menu_main, menu); return true }
              override fun onOptionsItemSelected(item: MenuItem): Boolean {
                  return when (item.itemId) {
                      R.id.action_search -> { startActivity(Intent(this, SearchActivity::class.java)); true }
                      R.id.action_appointments_all -> { startActivity(Intent(this, com.propertydealer.app.ui.appointment.AppointmentActivity::class.java).apply { putExtra("mode", com.propertydealer.app.ui.appointment.AppointmentActivity.MODE_ALL) }); true }
                      R.id.action_emi_calc -> { startActivity(Intent(this, com.propertydealer.app.ui.tools.EmiCalculatorActivity::class.java)); true }
                      R.id.action_compare -> { startActivity(Intent(this, com.propertydealer.app.ui.tools.PropertyCompareActivity::class.java)); true }
                      R.id.action_guest_settings -> { startActivity(Intent(this, com.propertydealer.app.ui.settings.DealerSettingsActivity::class.java)); true }
                      R.id.action_logout -> {
                          AlertDialog.Builder(this).setTitle("Logout?")
                              .setPositiveButton("Logout") { _, _ -> UserSession.forceLogout(); startActivity(Intent(this, LoginActivity::class.java)); finishAffinity() }
                              .setNegativeButton("Cancel", null).show(); true
                      }
                      else -> super.onOptionsItemSelected(item)
                  }
              }
              override fun onResume() { super.onResume(); viewModel.refreshStats() }
          }
