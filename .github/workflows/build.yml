name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract ZIP
        run: unzip PropertyDealerApp_v2.zip

      - name: Set Android SDK path
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > PropertyDealerApp/local.properties

      - name: Generate Gradle Wrapper
        working-directory: PropertyDealerApp
        run: |
          gradle wrapper --gradle-version 8.0
          chmod +x gradlew

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Debug APK
        working-directory: PropertyDealerApp
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PropertyDealerApp-debug
          path: PropertyDealerApp/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
