name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Extract ZIP
        run: unzip PropertyDealerApp_v2.zip

      - name: Set Android SDK path
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > PropertyDealerApp/local.properties

      - name: Install Gradle 8.0
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip -O gradle.zip
          unzip -q gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.0/bin" >> $GITHUB_PATH

      - name: Generate Gradle Wrapper
        working-directory: PropertyDealerApp
        run: |
          /opt/gradle/gradle-8.0/bin/gradle wrapper --gradle-version 8.0
          chmod +x gradlew

      - name: Install build tools
        run: |
          sdkmanager "build-tools;34.0.0" "platforms;android-34" || true

      - name: Build Debug APK
        working-directory: PropertyDealerApp
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PropertyDealerApp-debug
          path: PropertyDealerApp/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
