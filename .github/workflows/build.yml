          package com.propertydealer.app.ui.property
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.view.Menu
          import android.view.MenuItem
          import androidx.activity.viewModels
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.recyclerview.widget.LinearLayoutManager
          import com.propertydealer.app.R
          import com.propertydealer.app.data.model.Property
          import com.propertydealer.app.databinding.ActivityPropertyDetailBinding
          import com.propertydealer.app.ui.adapters.BuyerAdapter
          import com.propertydealer.app.utils.FormatUtils
          import com.propertydealer.app.utils.ShareUtils
          class PropertyDetailActivity : AppCompatActivity() {
              companion object { const val EXTRA_PROPERTY_ID = "extra_property_id" }
              private lateinit var binding: ActivityPropertyDetailBinding
              private val viewModel: PropertyViewModel by viewModels { PropertyViewModelFactory(application) }
              private var currentProperty: Property? = null
              private var propertyId = ""
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  binding = ActivityPropertyDetailBinding.inflate(layoutInflater)
                  setContentView(binding.root)
                  propertyId = intent.getStringExtra(EXTRA_PROPERTY_ID) ?: ""
                  setSupportActionBar(binding.toolbar)
                  supportActionBar?.setDisplayHomeAsUpEnabled(true)
                  binding.toolbar.setNavigationOnClickListener { finish() }
                  viewModel.getPropertyById(propertyId) { property ->
                      property?.let { runOnUiThread { displayProperty(it) } }
                  }
                  setupBuyerList()
              }
              private fun displayProperty(property: Property) {
                  currentProperty = property
                  supportActionBar?.title = property.name
                  supportActionBar?.subtitle = property.propertyType
                  binding.textDetailAddress.text = property.address
                  binding.textDetailSize.text = buildString {
                      if (property.width > 0 && property.depth > 0) append("${property.width.toInt()} x ${property.depth.toInt()} ft\n")
                      if (property.totalSqFeet > 0) append("${property.totalSqFeet.toInt()} sq.ft")
                      if (property.totalSqYard > 0) append("  |  ${String.format("%.2f", property.totalSqYard)} sq.yd")
                      if (property.frontRoadSize > 0) append("\nFront Road: ${property.frontRoadSize.toInt()} ft")
                  }.ifEmpty { "Not specified" }
                  binding.textDetailPrice.text = FormatUtils.formatCurrencyShort(property.totalPrice)
                  if (property.pricePerSqYard > 0) binding.textDetailPricePerSqYard.text = "${FormatUtils.formatCurrencyShort(property.pricePerSqYard)}/sq.yd"
                  if (property.whitePrice > 0) binding.textDetailWhitePrice.text = "White: ${FormatUtils.formatCurrencyShort(property.whitePrice)}"
                  if (property.blackPrice > 0) binding.textDetailBlackPrice.text = "Black: ${FormatUtils.formatCurrencyShort(property.blackPrice)}"
                  binding.textDetailSellerName.text = property.sellerName
                  binding.textDetailSellerPhone.text = property.sellerPhone
                  binding.textDetailStatus.text = property.status
                  binding.textDetailFacing.text = property.facing.ifEmpty { "-" }
                  binding.textDetailType.text = property.propertyType
                  binding.textDetailDescription.text = property.description.ifEmpty { "-" }
                  binding.textDetailNotes.text = property.notes.ifEmpty { "-" }
                  binding.btnCallSeller.setOnClickListener { startActivity(Intent(Intent.ACTION_DIAL, Uri.parse("tel:${property.sellerPhone}"))) }
                  binding.btnViewOnMap.setOnClickListener {
                      if (property.latitude != 0.0 && property.longitude != 0.0) {
                          startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("geo:${property.latitude},${property.longitude}?q=${property.latitude},${property.longitude}")))
                      } else {
                          startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("geo:0,0?q=${Uri.encode(property.address)}")))
                      }
                  }
              }
              private fun setupBuyerList() {
                  val buyerAdapter = BuyerAdapter(
                      onEditClick = { buyer -> startActivity(Intent(this, com.propertydealer.app.ui.buyer.AddBuyerActivity::class.java).apply { putExtra(com.propertydealer.app.ui.buyer.AddBuyerActivity.EXTRA_PROPERTY_ID, propertyId); putExtra(com.propertydealer.app.ui.buyer.AddBuyerActivity.EXTRA_BUYER_ID, buyer.id) }) },
                      onDeleteClick = { buyer -> AlertDialog.Builder(this).setTitle("Remove buyer?").setPositiveButton("Remove") { _, _ -> viewModel.deleteBuyer(buyer) }.setNegativeButton("Cancel", null).show() },
                      onCallClick = { buyer -> startActivity(Intent(Intent.ACTION_DIAL, Uri.parse("tel:${buyer.phone}"))) }
                  )
                  binding.recyclerBuyers.apply { layoutManager = LinearLayoutManager(this@PropertyDetailActivity); adapter = buyerAdapter }
                  viewModel.getBuyersForProperty(propertyId).observe(this) { buyerAdapter.submitList(it) }
                  binding.btnAddBuyer.setOnClickListener { startActivity(Intent(this, com.propertydealer.app.ui.buyer.AddBuyerActivity::class.java).apply { putExtra(com.propertydealer.app.ui.buyer.AddBuyerActivity.EXTRA_PROPERTY_ID, propertyId) }) }
              }
              override fun onCreateOptionsMenu(menu: Menu): Boolean { menuInflater.inflate(R.menu.menu_property_detail, menu); return true }
              override fun onOptionsItemSelected(item: MenuItem): Boolean {
                  val p = currentProperty ?: return super.onOptionsItemSelected(item)
                  return when (item.itemId) {
                      R.id.action_edit -> { startActivity(Intent(this, AddEditPropertyActivity::class.java).apply { putExtra(AddEditPropertyActivity.EXTRA_PROPERTY_ID, p.id) }); true }
                      R.id.action_delete -> { AlertDialog.Builder(this).setTitle("Delete '${p.name}'?").setPositiveButton("Delete") { _, _ -> viewModel.deleteProperty(p); finish() }.setNegativeButton("Cancel", null).show(); true }
                      R.id.action_share_buyer -> { startActivity(Intent.createChooser(Intent(Intent.ACTION_SEND).apply { type = "text/plain"; putExtra(Intent.EXTRA_TEXT, ShareUtils.generateBuyerShareText(p)) }, "Share via")); true }
                      R.id.action_full_report -> { startActivity(Intent.createChooser(Intent(Intent.ACTION_SEND).apply { type = "text/plain"; putExtra(Intent.EXTRA_TEXT, ShareUtils.generateDealerShareText(p)) }, "Share via")); true }
                      R.id.action_distance -> { startActivity(Intent(this, DistanceCalculatorActivity::class.java).apply { putExtra(DistanceCalculatorActivity.EXTRA_PROPERTY_LAT, p.latitude); putExtra(DistanceCalculatorActivity.EXTRA_PROPERTY_LON, p.longitude); putExtra(DistanceCalculatorActivity.EXTRA_PROPERTY_NAME, p.name); putExtra(DistanceCalculatorActivity.EXTRA_PROPERTY_ADDRESS, p.address) }); true }
                      R.id.action_documents -> { startActivity(Intent(this, com.propertydealer.app.ui.document.DocumentManagerActivity::class.java).apply { putExtra(com.propertydealer.app.ui.document.DocumentManagerActivity.EXTRA_PROPERTY_ID, p.id); putExtra(com.propertydealer.app.ui.document.DocumentManagerActivity.EXTRA_PROPERTY_NAME, p.name) }); true }
                      R.id.action_appointments -> { startActivity(Intent(this, com.propertydealer.app.ui.appointment.AppointmentActivity::class.java).apply { putExtra(com.propertydealer.app.ui.appointment.AppointmentActivity.EXTRA_PROPERTY_ID, p.id); putExtra(com.propertydealer.app.ui.appointment.AppointmentActivity.EXTRA_PROPERTY_NAME, p.name) }); true }
                      R.id.action_negotiation -> { startActivity(Intent(this, com.propertydealer.app.ui.negotiation.NegotiationActivity::class.java).apply { putExtra(com.propertydealer.app.ui.negotiation.NegotiationActivity.EXTRA_PROPERTY_ID, p.id); putExtra(com.propertydealer.app.ui.negotiation.NegotiationActivity.EXTRA_PROPERTY_NAME, p.name) }); true }
                      R.id.action_compare -> { startActivity(Intent(this, com.propertydealer.app.ui.tools.PropertyCompareActivity::class.java).apply { putExtra(com.propertydealer.app.ui.tools.PropertyCompareActivity.EXTRA_PROPERTY_A_ID, p.id) }); true }
                      else -> super.onOptionsItemSelected(item)
                  }
              }
          }
          EOF
      - name: Fix remaining files with Python
        working-directory: PropertyDealerApp
        run: |
          python3 << 'PYEOF'
          import os

          def fix_file(path, bad_keywords):
              if not os.path.exists(path): return
              with open(path) as f: lines = f.readlines()
              clean = [l for l in lines if not any(k in l for k in bad_keywords)]
              with open(path, 'w') as f: f.writelines(clean)
              print(f"Fixed: {path}")

          fix_file("app/src/main/java/com/propertydealer/app/ui/buyer/AddBuyerActivity.kt",
              ["AppDatabase", "import com.propertydealer.app.data.db"])

          fix_file("app/src/main/java/com/propertydealer/app/ui/negotiation/NegotiationActivity.kt",
              ["AppDatabase", "import com.propertydealer.app.data.db", "getFilteredProperties"])

          fix_file("app/src/main/java/com/propertydealer/app/ui/appointment/AppointmentActivity.kt",
              ["AppDatabase", "import com.propertydealer.app.data.db"])

          fix_file("app/src/main/java/com/propertydealer/app/ui/document/DocumentManagerActivity.kt",
              ["AppDatabase", "import com.propertydealer.app.data.db"])

          for path in [
              "app/src/main/java/com/propertydealer/app/ui/buyer/AddBuyerActivity.kt",
              "app/src/main/java/com/propertydealer/app/ui/negotiation/NegotiationActivity.kt",
              "app/src/main/java/com/propertydealer/app/ui/appointment/AppointmentActivity.kt",
              "app/src/main/java/com/propertydealer/app/ui/document/DocumentManagerActivity.kt",
          ]:
              if not os.path.exists(path): continue
              with open(path) as f: content = f.read()
              content = content.replace("getLongExtra(EXTRA_PROPERTY_ID, -1L)", 'getStringExtra(EXTRA_PROPERTY_ID) ?: ""')
              content = content.replace("getLongExtra(EXTRA_BUYER_ID, -1L)", 'getStringExtra(EXTRA_BUYER_ID) ?: ""')
              with open(path, 'w') as f: f.write(content)

          print("All done!")
          PYEOF
