name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses || true
      - run: sdkmanager "build-tools;34.0.0" "platforms;android-34" || true
      - name: Find and Extract ZIP
        run: |
          ZIP=$(find . -name "PropertyDealerApp_v3.zip" -not -path "./.git/*" | head -1)
          echo "Found: $ZIP"
          unzip "$ZIP"
      - name: Set SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > PropertyDealerApp/local.properties
      - name: Dummy google-services.json
        working-directory: PropertyDealerApp/app
        run: |
          echo '{"project_info":{"project_number":"000000000000","project_id":"property-dealer-app","storage_bucket":"property-dealer-app.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.propertydealer.app"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyReplaceWithRealOne"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > google-services.json
      - name: Fix build.gradle
        working-directory: PropertyDealerApp
        run: |
          cat > build.gradle << 'EOF'
          buildscript {
              ext.kotlin_version = '1.9.0'
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.3.2'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
                  classpath 'com.google.gms:google-services:4.4.0'
              }
          }
          EOF
      - name: Fix settings.gradle
        working-directory: PropertyDealerApp
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "PropertyDealerApp"
          include ':app'
          EOF
      - name: Fix app/build.gradle
        working-directory: PropertyDealerApp
        run: |
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'kotlin-kapt'
              id 'kotlin-parcelize'
              id 'com.google.gms.google-services'
          }
          android {
              namespace 'com.propertydealer.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.propertydealer.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
              buildFeatures { viewBinding true; dataBinding true }
          }
          dependencies {
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.cardview:cardview:1.0.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.activity:activity-ktx:1.8.0'
              implementation 'androidx.fragment:fragment-ktx:1.6.2'
              implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
              implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'
              implementation platform('com.google.firebase:firebase-bom:32.7.0')
              implementation 'com.google.firebase:firebase-firestore-ktx'
              implementation 'com.google.firebase:firebase-messaging-ktx'
              implementation 'com.google.android.gms:play-services-location:21.0.1'
              implementation 'com.github.bumptech.glide:glide:4.16.0'
              testImplementation 'junit:junit:4.13.2'
          }
          EOF
      - name: Fix colors
        working-directory: PropertyDealerApp
        run: |
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#1A237E</color>
              <color name="colorPrimaryDark">#0D1453</color>
              <color name="colorAccent">#FF6F00</color>
              <color name="colorAccentLight">#FFD54F</color>
              <color name="white">#FFFFFF</color>
              <color name="black">#000000</color>
              <color name="cardBackground">#FFFFFF</color>
              <color name="background">#F5F5F5</color>
              <color name="textPrimary">#212121</color>
              <color name="textSecondary">#757575</color>
              <color name="divider">#E0E0E0</color>
              <color name="statusAvailable">#2E7D32</color>
              <color name="statusSold">#1565C0</color>
              <color name="statusPending">#E65100</color>
              <color name="statusNegotiating">#6A1B9A</color>
          </resources>
          EOF
      - name: Fix icons
        working-directory: PropertyDealerApp
        run: |
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/colorPrimary"/><foreground android:drawable="@drawable/ic_property"/></adaptive-icon>' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            printf '<?xml version="1.0" encoding="utf-8"?><resources/>' > app/src/main/res/mipmap-${d}/ic_launcher.xml
            cp app/src/main/res/mipmap-${d}/ic_launcher.xml app/src/main/res/mipmap-${d}/ic_launcher_round.xml
          done
      - name: Remove old Room files
        working-directory: PropertyDealerApp
        run: rm -f app/src/main/java/com/propertydealer/app/data/db/*.kt
      - name: Fix PropertyViewModel
        working-directory: PropertyDealerApp
        run: |
          cat > app/src/main/java/com/propertydealer/app/ui/property/PropertyViewModel.kt << 'EOF'
          package com.propertydealer.app.ui.property
          import android.app.Application
          import androidx.lifecycle.*
          import com.propertydealer.app.data.model.*
          import com.propertydealer.app.firebase.FirebaseRepository
          import com.google.firebase.firestore.ListenerRegistration
          import kotlinx.coroutines.launch
          class PropertyViewModel(application: Application) : AndroidViewModel(application) {
              private val _properties = MutableLiveData<List<Property>>()
              val allProperties: LiveData<List<Property>> = _properties
              private val _appointments = MutableLiveData<List<Appointment>>()
              val upcomingAppointments: LiveData<List<Appointment>> = _appointments
              private var propertyListener: ListenerRegistration? = null
              private var appointmentListener: ListenerRegistration? = null
              val totalCount = MutableLiveData(0)
              val availableCount = MutableLiveData(0)
              val soldCount = MutableLiveData(0)
              val upcomingCount = MutableLiveData(0)
              init {
                  propertyListener = FirebaseRepository.listenToProperties { list ->
                      _properties.postValue(list)
                      totalCount.postValue(list.size)
                      availableCount.postValue(list.count { it.status == "Available" })
                      soldCount.postValue(list.count { it.status == "Sold" })
                  }
                  appointmentListener = FirebaseRepository.listenToAppointments { list ->
                      val upcoming = list.filter { it.status == "Scheduled" && it.scheduledAt >= System.currentTimeMillis() }
                      _appointments.postValue(upcoming)
                      upcomingCount.postValue(upcoming.size)
                  }
              }
              fun refreshStats() {}
              fun insertProperty(property: Property, onResult: (String) -> Unit = {}) {
                  viewModelScope.launch { FirebaseRepository.addProperty(property).onSuccess { onResult(it) } }
              }
              fun updateProperty(property: Property) { viewModelScope.launch { FirebaseRepository.updateProperty(property) } }
              fun deleteProperty(property: Property) { viewModelScope.launch { FirebaseRepository.deleteProperty(property.id) } }
              fun getPropertyById(id: String, onResult: (Property?) -> Unit) { viewModelScope.launch { onResult(FirebaseRepository.getProperty(id)) } }
              fun searchProperties(query: String): LiveData<List<Property>> {
                  val result = MutableLiveData<List<Property>>()
                  val q = query.lowercase()
                  allProperties.observeForever { list -> result.postValue(list.filter { it.name.lowercase().contains(q) || it.address.lowercase().contains(q) || it.sellerName.lowercase().contains(q) }) }
                  return result
              }
              fun getBuyersForProperty(propertyId: String): LiveData<List<Buyer>> {
                  val result = MutableLiveData<List<Buyer>>()
                  FirebaseRepository.listenToBuyersForProperty(propertyId) { result.postValue(it) }
                  return result
              }
              fun getAllBuyers(): LiveData<List<Buyer>> {
                  val result = MutableLiveData<List<Buyer>>()
                  FirebaseRepository.listenToAllBuyers { result.postValue(it) }
                  return result
              }
              fun insertBuyer(buyer: Buyer) { viewModelScope.launch { FirebaseRepository.addBuyer(buyer) } }
              fun updateBuyer(buyer: Buyer) { viewModelScope.launch { FirebaseRepository.updateBuyer(buyer) } }
              fun deleteBuyer(buyer: Buyer) { viewModelScope.launch { FirebaseRepository.deleteBuyer(buyer.id) } }
              fun getDocumentsForProperty(propertyId: String) = MutableLiveData<List<PropertyDocument>>()
              fun getImagesForProperty(propertyId: String) = MutableLiveData<List<PropertyDocument>>()
              fun getPdfsForProperty(propertyId: String) = MutableLiveData<List<PropertyDocument>>()
              fun insertDocument(doc: PropertyDocument, onResult: (String) -> Unit = {}) {}
              fun deleteDocument(doc: PropertyDocument, onDeleted: () -> Unit = {}) {}
              fun setCoverImage(doc: PropertyDocument) {}
              fun getAllAppointments(): LiveData<List<Appointment>> = upcomingAppointments
              fun getAppointmentsForProperty(propertyId: String): LiveData<List<Appointment>> {
                  val result = MutableLiveData<List<Appointment>>()
                  upcomingAppointments.observeForever { list -> result.postValue(list.filter { it.propertyId == propertyId }) }
                  return result
              }
              fun insertAppointment(appt: Appointment, onResult: (String) -> Unit = {}) { viewModelScope.launch { FirebaseRepository.addAppointment(appt).onSuccess { onResult(it) } } }
              fun updateAppointment(appt: Appointment) { viewModelScope.launch { FirebaseRepository.updateAppointment(appt) } }
              fun deleteAppointment(appt: Appointment) { viewModelScope.launch { FirebaseRepository.deleteAppointment(appt.id) } }
              fun getNegotiationsForProperty(propertyId: String): LiveData<List<NegotiationEntry>> {
                  val result = MutableLiveData<List<NegotiationEntry>>()
                  FirebaseRepository.listenToNegotiations(propertyId) { result.postValue(it) }
                  return result
              }
              fun insertNegotiation(entry: NegotiationEntry) { viewModelScope.launch { FirebaseRepository.addNegotiation(entry) } }
              fun deleteNegotiation(entry: NegotiationEntry) { viewModelScope.launch { FirebaseRepository.deleteNegotiation(entry.id) } }
              override fun onCleared() { super.onCleared(); propertyListener?.remove(); appointmentListener?.remove() }
          }
          class PropertyViewModelFactory(private val application: Application) : ViewModelProvider.Factory {
              override fun <T : ViewModel> create(modelClass: Class<T>): T {
                  if (modelClass.isAssignableFrom(PropertyViewModel::class.java)) { @Suppress("UNCHECKED_CAST") return PropertyViewModel(application) as T }
                  throw IllegalArgumentException("Unknown ViewModel class")
              }
          }
          EOF
      - name: Fix Kotlin code errors
        working-directory: PropertyDealerApp
        run: |
          # Fix area/areaUnit references
          for f in \
            app/src/main/java/com/propertydealer/app/ui/adapters/PropertyAdapter.kt \
            app/src/main/java/com/propertydealer/app/utils/ShareUtils.kt \
            app/src/main/java/com/propertydealer/app/ui/tools/PropertyCompareActivity.kt \
            app/src/main/java/com/propertydealer/app/ui/property/PropertyDetailActivity.kt \
            app/src/main/java/com/propertydealer/app/ui/property/AddEditPropertyActivity.kt; do
            sed -i 's/\.area\b/.totalSqYard.toString()/g' "$f" 2>/dev/null || true
            sed -i 's/\.areaUnit/"sq.yd"/g' "$f" 2>/dev/null || true
          done
          # Fix action_share_dealer
          sed -i 's/action_share_dealer/action_full_report/g' \
            app/src/main/java/com/propertydealer/app/ui/property/PropertyDetailActivity.kt
          # Remove stale references
          for f in \
            app/src/main/java/com/propertydealer/app/ui/property/MainActivity.kt \
            app/src/main/java/com/propertydealer/app/ui/property/AddEditPropertyActivity.kt; do
            sed -i '/setSearchQuery\|setStatusFilter\|setTypeFilter\|operationStatus\|getFilteredProperties\|AppDatabase\|editTextArea\b\|autoCompleteAreaUnit\|editTextPropertyName\|tilPropertyName\|tilAddress\b\|tilSellerName\|tilSellerPhone/d' "$f" 2>/dev/null || true
          done
          # Fix Long to String type mismatches for IDs
          for f in \
            app/src/main/java/com/propertydealer/app/ui/buyer/AddBuyerActivity.kt \
            app/src/main/java/com/propertydealer/app/ui/negotiation/NegotiationActivity.kt \
            app/src/main/java/com/propertydealer/app/ui/appointment/AppointmentActivity.kt \
            app/src/main/java/com/propertydealer/app/ui/document/DocumentManagerActivity.kt; do
            sed -i 's/getLongExtra(\(.*\), -1L)/getStringExtra(\1) ?: ""/g' "$f" 2>/dev/null || true
            sed -i '/AppDatabase\|import.*db\b/d' "$f" 2>/dev/null || true
          done
          # Fix GuestPropertyDetailActivity
          sed -i 's/FormatUtils.getStatusColor(this,/FormatUtils.getStatusColor(/g' \
            app/src/main/java/com/propertydealer/app/ui/guest/GuestPropertyDetailActivity.kt 2>/dev/null || true
          sed -i '/private suspend fun.*await/,/^          }/d' \
            app/src/main/java/com/propertydealer/app/ui/guest/GuestPropertyDetailActivity.kt 2>/dev/null || true
          echo "All fixes done"
      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O g.zip
          unzip -q g.zip -d /opt/gradle
      - name: Generate wrapper
        working-directory: PropertyDealerApp
        run: |
          /opt/gradle/gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          chmod +x gradlew
      - name: Build APK
        working-directory: PropertyDealerApp
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PropertyDealerApp-v3
          path: PropertyDealerApp/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
